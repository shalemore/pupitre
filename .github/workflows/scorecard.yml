name: Scorecard

# OpenSSF Scorecard rates the practices of the repository itself: branch protection, review, pinned
# dependencies, signed releases and so on. It reads the repository over the API rather than the
# code, so it needs no build.
on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]

# The analysis reads the repository and writes nothing. Only its job uploads the results and signs
# them, and a job's permissions replace these, so it declares its own.
permissions:
  contents: read
  actions: read

jobs:
  analysis:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The results are both published to the OpenSSF database and written here as SARIF, which the
      # code scanning tab shows beside the CodeQL alerts.
      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: results.sarif
