name: Release

# Automatically build multi-platform installers, generate changelog, and publish release when a new version is pushed to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Pre-flight & Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: preflight
        uses: ./.github/actions/preflight
        with:
          filter-ci: true

      - id: check
        if: steps.preflight.outputs.skip != 'true'
        run: |
          ver="${{ steps.preflight.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$ver" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The builds run in parallel and electron-builder creates the draft release when it finds
      # none, so without this one each build could create a draft of its own and split the files.
      - name: Create the draft release the builds upload to
        if: steps.check.outputs.publish == 'true'
        run: gh release create "v$VERSION" --draft --title "$VERSION" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.preflight.outputs.version }}

  build-artifacts:
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      # electron-builder finds the draft release named after the package.json version and uploads
      # the installers and update metadata to it
      - run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [check, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes and publish release
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          section() {
            lines=$(git log ${previous:+"$previous..HEAD"} --no-merges --format=%s \
              | { grep -E "^($2)(\([^)]*\))?$3: " || true; } \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: //; s/^(.)/\U\1/; s/([^.])$/\1./; s/^/* /')
            if [ -n "$lines" ]; then printf '### %s\n\n%s\n\n' "$1" "$lines"; fi
          }
          {
            section 'Breaking changes' '[a-z]+' '!'
            section 'New features' feat ''
            section 'Improvements' 'perf|refactor' ''
            section 'Bug fixes' fix ''
            if [ -n "$previous" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...v$VERSION"
            fi
          } > notes.md

          # Publish the draft release created by electron-builder with the generated notes
          gh release edit "v$VERSION" --draft=false --notes-file notes.md

  # Scoop unpacks the released installer instead of running it, see scripts/scoop-manifest.mjs. The
  # bucket needs the secret SCOOP_BUCKET_TOKEN, see CONTRIBUTING.md; without it the release is still
  # published.
  scoop:
    needs: [check, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the Scoop manifest to the release
        run: |
          gh release download "v$VERSION" --pattern '*-win-x64.exe' --dir dist
          node scripts/scoop-manifest.mjs dist/*-win-x64.exe dist
          gh release upload "v$VERSION" dist/*.scoop.json dist/*.sha256
        env:
          GH_TOKEN: ${{ github.token }}

      # The workflow token cannot reach another repository, so this uses its own token. The bucket
      # is the repository called scoop-bucket of the same owner, unless the repository variable
      # SCOOP_BUCKET names another one.
      - name: Ask the Scoop bucket to import the manifest
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SCOOP_BUCKET_TOKEN is not set, so the Scoop bucket was not updated"
            exit 0
          fi
          gh workflow run import-manifest.yml --repo "$BUCKET" -f repo="$GITHUB_REPOSITORY" -f tag="v$VERSION"
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          BUCKET: ${{ vars.SCOOP_BUCKET || format('{0}/scoop-bucket', github.repository_owner) }}
