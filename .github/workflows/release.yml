name: Release

# Automatically build multi-platform installers, generate changelog, and publish release when a new version is pushed to main.
on:
  push:
    branches: [main]
    # A release exists only when the version changes; running this on every main push made its
    # completion trigger a second Pages deployment for no new tag.
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      scoop:
        description: "Version whose Scoop manifest to rebuild alone, such as 0.7.2"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Pre-flight & Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: preflight
        uses: ./.github/actions/preflight
        with:
          filter-ci: true

      - id: check
        if: steps.preflight.outputs.skip != 'true'
        run: |
          ver="${{ steps.preflight.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$ver" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The builds run in parallel and electron-builder creates the draft release when it finds
      # none, so without this one each build could create a draft of its own and split the files.
      - name: Create the draft release the builds upload to
        if: steps.check.outputs.publish == 'true'
        run: gh release create "v$VERSION" --draft --title "$VERSION" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.preflight.outputs.version }}

  build-artifacts:
    needs: check
    if: needs.check.outputs.publish == 'true'
    # id-token and attestations sign the provenance and the SBOM of the built installers
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-node

      # electron-builder finds the draft release named after the package.json version and uploads
      # the installers and update metadata to it. A platform gets only the credentials it can use:
      # a certificate exported for Windows never reaches the mac build, and the other way round.
      # A repository without them builds the same installers, unsigned.
      - name: Build and publish the macOS installers
        if: matrix.platform == 'macos-latest'
        run: |
          # A missing secret arrives as an empty string; electron-builder would read it as a certificate path
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build and publish the Windows installers
        if: matrix.platform == 'windows-latest'
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build and publish the Linux packages
        if: matrix.platform == 'ubuntu-latest'
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # What is attested is the installers, not release/: the folder also holds the unpacked app
      # folders and the update metadata, and an attestation over a directory means nothing.
      - name: Collect the installers
        id: installers
        shell: bash
        run: |
          {
            echo "paths<<INSTALLERS"
            node scripts/release-artifacts.ts
            echo "INSTALLERS"
          } >> "$GITHUB_OUTPUT"

      # npm writes the CycloneDX SBOM of the dependencies it resolves from the lockfile
      - name: Generate the SBOM
        shell: bash
        run: npm sbom --sbom-format=cyclonedx > "pupitre-${{ matrix.platform }}.cdx.json"

      # Both attestations cover every installer of the job, and each is signed with the identity of
      # this workflow run. They run after the build, so a run that cannot sign one fails the
      # release instead of publishing files nothing vouches for.
      - name: Attest the build provenance of the installers
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.installers.outputs.paths }}

      - name: Attest the SBOM of the installers
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: ${{ steps.installers.outputs.paths }}
          sbom-path: pupitre-${{ matrix.platform }}.cdx.json

      - name: Attach the SBOM to the draft release
        shell: bash
        run: gh release upload "v$VERSION" "pupitre-${{ matrix.platform }}.cdx.json" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}

  publish-release:
    needs: [check, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Generate release notes and publish release
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          section() {
            lines=$(git log ${previous:+"$previous..HEAD"} --no-merges --format=%s \
              | { grep -E "^($2)(\([^)]*\))?$3: " || true; } \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: //; s/^(.)/\U\1/; s/([^.])$/\1./; s/^/* /')
            if [ -n "$lines" ]; then printf '### %s\n\n%s\n\n' "$1" "$lines"; fi
          }
          {
            section 'Breaking changes' '[a-z]+' '!'
            section 'New features' feat ''
            section 'Improvements' 'perf|refactor' ''
            section 'Bug fixes' fix ''
            if [ -n "$previous" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...v$VERSION"
            fi
          } > notes.md

          # Publish the draft release created by electron-builder with the generated notes
          gh release edit "v$VERSION" --draft=false --notes-file notes.md

  # Scoop unpacks the released installer instead of running it, see scripts/scoop-manifest.ts. The
  # bucket needs the secret SCOOP_BUCKET_TOKEN, see CONTRIBUTING.md; without it the release is still
  # published.
  scoop:
    needs: [check, publish-release]
    # A dispatch that names a version rebuilds only the manifest of a release that is already out
    if: ${{ always() && (inputs.scoop != '' || needs.publish-release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.scoop || needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The manifest script runs on its own, so only Node is set up, not the dependencies
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Add the Scoop manifest to the release
        run: |
          # The version may be given with or without the leading v
          VERSION="${VERSION#v}"
          gh release download "v$VERSION" --pattern '*-win-x64.exe' --dir dist
          node scripts/scoop-manifest.ts dist/*-win-x64.exe dist
          gh release upload "v$VERSION" dist/*.scoop.json dist/*.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # The workflow token cannot reach another repository, so this uses its own token. The bucket
      # is the repository called scoop-bucket of the same owner, unless the repository variable
      # SCOOP_BUCKET names another one.
      - name: Ask the Scoop bucket to import the manifest
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SCOOP_BUCKET_TOKEN is not set, so the Scoop bucket was not updated"
            exit 0
          fi
          gh workflow run import-manifest.yml --repo "$BUCKET" -f repo="$GITHUB_REPOSITORY" -f tag="v${VERSION#v}"
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          BUCKET: ${{ vars.SCOOP_BUCKET || format('{0}/scoop-bucket', github.repository_owner) }}
