name: CodeQL

# Static analysis of the JavaScript and TypeScript of every process. The editor, the renderer and
# the main process are one code base and none of them needs to be built for the analysis, so the
# run installs nothing.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 2 * * 1"

# The analysis reads the repository and writes nothing. Only the job that uploads its results needs
# to write, and a job's permissions replace these, so it declares its own.
permissions:
  contents: read
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
