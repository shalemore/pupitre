name: "Setup Node"
description: "Set up Node.js and install dependencies from the lockfile"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
