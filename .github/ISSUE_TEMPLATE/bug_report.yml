name: Bug report
description: Something in Pupitre does not work the way it should.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not paste the text of a document you
        were editing: a bug can be described without it, and a repository issue is public.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you report
      options:
        - label: I am running the latest release.
          required: true
        - label: I searched the open and closed issues and found no report of this.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What the app did, and what you were doing when it did it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest way back to the problem, starting from a new window.
      placeholder: |
        1. Open a document with …
        2. Press …
        3. The window shows …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pupitre version
      description: >-
        Help › Report an Issue fills this in. Otherwise it is under Help › About (on macOS,
        Pupitre › About Pupitre), or in the name of the installer.
      placeholder: "0.7.2"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and desktop
      description: >-
        Help › Report an Issue fills this in, together with the Electron version. Otherwise write
        the version of the system here, and the desktop environment or window manager on Linux.
      placeholder: Windows 11 24H2 · macOS 15.2 · Ubuntu 24.04 on Wayland
    validations:
      required: true
  - type: input
    id: log
    attributes:
      label: Path of the log file
      description: |
        Help › Report an Issue fills this in, with the path written relative to your home folder.
        Windows `%APPDATA%\Pupitre\logs\main.log`, macOS `~/Library/Logs/Pupitre/main.log`,
        Linux `~/.config/Pupitre/logs/main.log`.
        Attach `main.log` to the issue by hand, and `main.old.log` too if the problem started
        earlier. Read it first if a file name you opened should not travel with the report.
      placeholder: ~/Library/Logs/Pupitre/main.log
    validations:
      required: false
