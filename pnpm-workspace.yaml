# apps/ holds the Electron app; packages/ holds what it shares with others.
packages:
  - apps/*
  - packages/*
  - plugins/*

# Dependencies with native build steps. pnpm 12 blocks every other package's scripts by default.
allowBuilds:
  "@parcel/watcher": true
  fsevents: true
  electron-winstaller: false

# Kept from the npm manifest; pnpm reads them here.
minimumReleaseAgeExclude:
  - "@ui-sdk/core@0.1.0-beta.13"
  - "@ui-sdk/solid@0.1.0-beta.13"
  - lucide-solid@1.77.0

overrides:
  minimatch: ^11.0.3
  "rimraf@^6>glob": ^14.0.3

# The upstream incremental-parse fix, in pnpm's package-root patch format.
patchedDependencies:
  "@lezer/markdown@1.8.1": patches/@lezer__markdown@1.8.1.patch
  lucide-solid@1.77.0: patches/lucide-solid@1.77.0.patch
