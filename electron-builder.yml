appId: com.shalemore.pupitre
productName: Pupitre
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
copyright: Copyright © ${author}
directories:
  buildResources: build
  output: release
files:
  - out/**
  # The browser demo is built into out/web for GitHub Pages; the desktop app never loads it
  - "!out/web/**"
  # It travels as an extraResource next to app.asar, not twice inside it
  - "!out/renderer/THIRD-PARTY-NOTICES.txt"
  - package.json
# Spend the build time on a smaller installer; this does not affect the unpacked app
compression: maximum
# Chromium's own translations are for its native dialogs and menus. Ship the languages Pupitre
# speaks; the app draws the rest of its interface from its own dictionaries. Electron has no
# Icelandic or Hong Kong locale: Icelandic native dialogs fall back to English, and Hong Kong uses
# zh-TW. en-GB is kept for English (United Kingdom) systems, and Spanish is one pak for es-ES.
electronLanguages:
  - ar
  - cs
  - da
  - de
  - el
  - en-GB
  - en-US
  - es
  - fa
  - fi
  - fr
  - hi
  - hu
  - id
  - it
  - ja
  - ko
  - nb
  - nl
  - pl
  - pt-BR
  - pt-PT
  - ru
  - sv
  - th
  - tr
  - uk
  - vi
  - zh-CN
  - zh-TW
# The licenses that travel with the app: Pupitre's own, and those of the packages bundled in it
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: out/renderer/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
publish:
  provider: github
  owner: shalemore
  repo: pupitre
  releaseType: draft
# Switches set in the Electron binary itself, so the packaged app only runs the code that was
# built. The first three take away the ways the runtime can be steered from the environment it
# starts in. The last two belong together: the integrity check only verifies the archive that is
# loaded, and onlyLoadAppFromAsar is what makes Electron load app.asar alone, never an unpacked
# app/ folder or default_app.asar that would go unchecked. grantFileProtocolExtraPrivileges stays
# on, because the windows load their page from file://.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Windows reads this as the app's DisplayName; the default appends the version, which Installed
  # apps already shows on the line below the name.
  uninstallDisplayName: ${productName}
mac:
  # electron-updater updates macOS from the zip; the dmg is for the first install
  target:
    - { target: dmg, arch: arm64 }
    - { target: zip, arch: arm64 }
  category: public.app-category.productivity
linux:
  target: [AppImage, deb]
  category: Office
  # deb packages require a maintainer with an email; the GitHub noreply address satisfies that
  maintainer: shalemore <190341017+shalemore@users.noreply.github.com>
# The Markdown documents Pupitre asks to open by default; the installers remove it on uninstall.
# Fewer than the DOCUMENT_EXTENSIONS the editor opens: mdx it can only just read, and txt is not
# Markdown, so neither is claimed here.
fileAssociations:
  - ext: [md, markdown, mdown, mkd]
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
