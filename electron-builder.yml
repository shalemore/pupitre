appId: com.shalemore.pupitre
productName: Pupitre
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
publish:
  provider: github
  owner: shalemore
  repo: pupitre
  releaseType: draft
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: [AppImage, deb]
  category: Office
