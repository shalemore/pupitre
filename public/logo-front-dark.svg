<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2a1c17"/>
      <stop offset="55%" stop-color="#18110e"/>
      <stop offset="100%" stop-color="#0d0806"/>
    </radialGradient>

    <linearGradient id="rimFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Slanted Walnut Reading Desk Top -->
    <linearGradient id="deskSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#462517"/>
      <stop offset="35%" stop-color="#381c11"/>
      <stop offset="100%" stop-color="#241008"/>
    </linearGradient>

    <!-- Desk Top Chamfer Highlight -->
    <linearGradient id="topBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Front Fascia Edge -->
    <linearGradient id="fasciaRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261008"/>
      <stop offset="100%" stop-color="#140603"/>
    </linearGradient>

    <!-- Retaining Ledge -->
    <linearGradient id="lipBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="45%" stop-color="#b85739"/>
      <stop offset="100%" stop-color="#6b220e"/>
    </linearGradient>

    <linearGradient id="lipHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcd7cc" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fcd7cc" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Pedestal Column -->
    <linearGradient id="pedestalCol" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b140b"/>
      <stop offset="30%" stop-color="#442115"/>
      <stop offset="70%" stop-color="#36190f"/>
      <stop offset="100%" stop-color="#1c0b05"/>
    </linearGradient>

    <!-- Recessed Architectural Panel Inside Column -->
    <linearGradient id="pedestalInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180803"/>
      <stop offset="100%" stop-color="#260f07"/>
    </linearGradient>

    <!-- Stepped Plinth Base -->
    <linearGradient id="plinthUpper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d2719"/>
      <stop offset="100%" stop-color="#2c130b"/>
    </linearGradient>
    <linearGradient id="plinthLower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#391b10"/>
      <stop offset="100%" stop-color="#190904"/>
    </linearGradient>

    <!-- Multi-stage Dropshadows -->
    <filter id="deskShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2b0802" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1a0401" flood-opacity="0.35"/>
    </filter>

    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- macOS Squircle Frame -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>

  <!-- Floor Ambient Contact Shadow -->
  <ellipse cx="256" cy="436" rx="146" ry="22" fill="url(#groundShadow)"/>

  <!-- ================= LECTERN STRUCTURE ================= -->
  <g filter="url(#deskShadow)">
    
    <!-- 1. BASE: Lower Tier Plinth (Width 224px, Height 18px) -->
    <path d="M 144 414 L 158 400 L 354 400 L 368 414 C 369 417 366 420 362 420 L 150 420 C 146 420 143 417 144 414 Z" fill="url(#plinthLower)"/>
    <rect x="148" y="414" width="216" height="8" rx="2" fill="#180803"/>
    <line x1="160" y1="401" x2="352" y2="401" stroke="#ffffff" stroke-width="1" opacity="0.2"/>

    <!-- 2. BASE: Upper Stepped Plinth (Width 174px, Height 14px) -->
    <path d="M 169 400 L 179 388 L 333 388 L 343 400 Z" fill="url(#plinthUpper)"/>
    <line x1="181" y1="389" x2="331" y2="389" stroke="#ffffff" stroke-width="0.8" opacity="0.25"/>

    <!-- 3. CENTRAL PEDESTAL COLUMN (Width 118px, Height 120px) -->
    <rect x="197" y="268" width="118" height="120" fill="url(#pedestalCol)"/>
    <!-- Recessed Architectural Center Panel (Depth Reveal) -->
    <rect x="211" y="278" width="90" height="100" rx="4" fill="url(#pedestalInner)"/>
    <rect x="211" y="278" width="90" height="100" rx="4" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.12"/>
    <!-- Column Corner Bevel Highlights -->
    <line x1="198" y1="268" x2="198" y2="388" stroke="#ffffff" stroke-width="0.8" opacity="0.18"/>
    <line x1="314" y1="268" x2="314" y2="388" stroke="#000000" stroke-width="1.2" opacity="0.45"/>

    <!-- 4. UNDER-DESK CONSOLE HOUSING (Wedge Support) -->
    <path d="M 134 260 L 197 272 L 315 272 L 378 260 Z" fill="#1b0803"/>

    <!-- 5. SLANTED READING DESK SURFACE (15 deg slope, 4:3 Millwork Ratio) -->
    <path d="M 136 134 C 140 130 146 128 154 128 L 358 128 C 366 128 372 130 376 134 L 410 256 C 413 261 410 266 404 266 L 108 266 C 102 266 99 261 102 256 Z" fill="url(#deskSurface)"/>

    <!-- Top Bevel Highlight Edge -->
    <path d="M 154 129 L 358 129" stroke="url(#topBevel)" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 138 135 L 104 257" stroke="#ffffff" stroke-width="1.0" opacity="0.22" stroke-linecap="round"/>
    <path d="M 374 135 L 408 257" stroke="#000000" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>

    <!-- Front Fascia Thickness -->
    <path d="M 108 266 L 404 266 C 409 266 412 269 411 274 L 409 278 C 408 282 405 284 400 284 L 112 284 C 107 284 104 282 103 278 L 101 274 C 100 269 103 266 108 266 Z" fill="url(#fasciaRim)"/>
    <line x1="108" y1="266.5" x2="404" y2="266.5" stroke="#ffffff" stroke-width="0.8" opacity="0.25"/>

    <!-- 6. THE MANUSCRIPT / PAPER (Mathematically Identical Perspective) -->
    <g filter="url(#paperShadow)">
      <path d="M 188.2 146.0 L 323.8 146.0 L 338.9 248.0 L 173.1 248.0 Z" fill="#ffffff"/>
      <path d="M 188.2 146.0 L 323.8 146.0" stroke="#ffffff" stroke-width="1" opacity="0.95"/>
      <path d="M 323.8 146.0 L 338.9 248.0" stroke="#ded8cd" stroke-width="0.8"/>
      <path d="M 338.9 248.0 L 173.1 248.0" stroke="#c9c1b3" stroke-width="0.8"/>
      <path d="M 173.1 248.0 L 188.2 146.0" stroke="#ffffff" stroke-width="0.8"/>

      <!-- H1 Header Bar (Terracotta) -->
      <path d="M 202.7 162.3 L 267.2 162.3 L 267.7 172.3 L 203.2 172.3 Z" fill="#cc6b49"/>

      <!-- Subtitle -->
      <path d="M 200.8 178.6 L 311.2 178.6 L 311.6 184.6 L 201.2 184.6 Z" fill="#2b2624" opacity="0.75"/>

      <!-- Bullet Item 1 -->
      <circle cx="203.5" cy="198.5" r="3" fill="#cc6b49"/>
      <path d="M 217.0 195.0 L 313.0 195.0 L 313.4 201.0 L 217.4 201.0 Z" fill="#2b2624" opacity="0.58"/>

      <!-- Bullet Item 2 -->
      <circle cx="201.8" cy="214.8" r="3" fill="#cc6b49"/>
      <path d="M 215.7 211.3 L 299.4 211.3 L 299.8 217.3 L 216.1 217.3 Z" fill="#2b2624" opacity="0.45"/>

      <!-- Blockquote / Accent Section -->
      <path d="M 195.5 225.6 L 197.9 225.6 L 196.1 241.9 L 193.7 241.9 Z" fill="#cc6b49"/>
      <path d="M 204.9 227.6 L 310.3 227.6 L 310.7 233.1 L 205.3 233.1 Z" fill="#2b2624" opacity="0.32"/>
      <path d="M 203.8 238.8 L 280.5 238.8 L 280.9 244.3 L 204.2 244.3 Z" fill="#2b2624" opacity="0.22"/>
    </g>

    <!-- 7. RETAINING LIP / BOOK STOP (Solid Chamfered Bar with Brass Rivets) -->
    <!-- Shadow onto Fascia -->
    <rect x="90" y="258" width="332" height="14" rx="7" fill="#000000" opacity="0.42"/>
    <!-- Ledge Main Body -->
    <rect x="88" y="253" width="336" height="15" rx="7.5" fill="url(#lipBar)"/>
    <!-- Top Specular Highlight Wire -->
    <line x1="98" y1="254.5" x2="414" y2="254.5" stroke="url(#lipHighlight)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Bottom Ambient Creep Shadow -->
    <line x1="98" y1="267" x2="414" y2="267" stroke="#380f05" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
    <!-- Brass End Rivets -->
    <circle cx="100" cy="260.5" r="2.2" fill="#fce5db" opacity="0.9"/>
    <circle cx="412" cy="260.5" r="2.2" fill="#fce5db" opacity="0.9"/>
  </g>

  <!-- macOS Superellipse Inner Specular Rim -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#rimFront)" stroke-width="2"/>
</svg>