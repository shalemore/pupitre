<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg3D" cx="44%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#df8263"/>
      <stop offset="55%" stop-color="#ba583a"/>
      <stop offset="100%" stop-color="#6a220e"/>
    </radialGradient>

    <linearGradient id="rim3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="groundShadow3D" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#260802" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#260802" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#260802" stop-opacity="0"/>
    </radialGradient>

    <!-- Slanted Top Surface (Wide & Gentle Slope, NOT a Tombstone!) -->
    <linearGradient id="desk3DTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2015"/>
      <stop offset="45%" stop-color="#311910"/>
      <stop offset="100%" stop-color="#220f08"/>
    </linearGradient>

    <!-- Left Cheek (6px Side Wood Thickness) -->
    <linearGradient id="deskCheek" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b140b"/>
      <stop offset="100%" stop-color="#190803"/>
    </linearGradient>

    <!-- Front Fascia -->
    <linearGradient id="deskFrontFascia" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e0904"/>
      <stop offset="100%" stop-color="#140502"/>
    </linearGradient>

    <!-- Refined 4px Retaining Ledge -->
    <linearGradient id="lip3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c96544"/>
      <stop offset="60%" stop-color="#9e472d"/>
      <stop offset="100%" stop-color="#66220f"/>
    </linearGradient>

    <!-- Column Left Face (Light) -->
    <linearGradient id="colLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d1d12"/>
      <stop offset="100%" stop-color="#2b140b"/>
    </linearGradient>

    <!-- Column Front Face (Medium Shade) -->
    <linearGradient id="colFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#271109"/>
      <stop offset="100%" stop-color="#1c0904"/>
    </linearGradient>

    <!-- Base Gradients -->
    <linearGradient id="baseLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#422115"/>
      <stop offset="100%" stop-color="#2a120a"/>
    </linearGradient>
    <linearGradient id="baseFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#220d06"/>
      <stop offset="100%" stop-color="#150502"/>
    </linearGradient>

    <filter id="deskCastShadow3D" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="6" dy="16" stdDeviation="16" flood-color="#260601" flood-opacity="0.48"/>
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#1a0401" flood-opacity="0.28"/>
    </filter>

    <filter id="paperShadow3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0.5" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg3D)"/>

  <!-- Ground Ambient Contact Shadow -->
  <ellipse cx="240" cy="432" rx="146" ry="20" fill="url(#groundShadow3D)"/>

  <!-- ================= 3D LECTERN STRUCTURE ================= -->
  <g filter="url(#deskCastShadow3D)">

    <!-- 1. BASE: Lower Tier -->
    <!-- Left face of lower plinth -->
    <path d="M 211.7 330.7 L 159.4 382.2 L 160.5 403.0 L 212.1 350.0 Z" fill="url(#baseLeft)"/>
    <!-- Front face of lower plinth -->
    <path d="M 159.4 382.2 L 308.7 419.5 L 308.1 441.3 L 160.5 403.0 Z" fill="url(#baseFront)"/>
    <!-- Top face of lower plinth -->
    <path d="M 211.7 330.7 L 293.9 383.9 L 308.7 419.5 L 159.4 382.2 Z" fill="#2c130b"/>
    <line x1="159.4" y1="382.2" x2="308.7" y2="419.5" stroke="#ffffff" stroke-width="0.6" opacity="0.2"/>

    <!-- 2. BASE: Upper Step -->
    <path d="M 223.0 340.9 L 184.8 358.2 L 185.6 379.4 Z" fill="url(#baseLeft)"/>
    <path d="M 184.8 358.2 L 293.9 383.9 L 293.4 405.8 L 185.6 379.4 Z" fill="url(#baseFront)"/>
    <path d="M 223.0 340.9 L 284.7 179.4 L 293.9 383.9 L 184.8 358.2 Z" fill="#36170d"/>
    <line x1="184.8" y1="358.2" x2="293.9" y2="383.9" stroke="#ffffff" stroke-width="0.5" opacity="0.22"/>

    <!-- 3. CENTRAL PEDESTAL COLUMN (Accurate 3D Box) -->
    <!-- Column Left Face (Light) -->
    <path d="M 229.8 151.1 L 203.7 167.7 L 208.4 354.9 L 232.0 330.5 Z" fill="url(#colLeft)"/>
    <!-- Column Front Face (Medium) -->
    <path d="M 203.7 167.7 L 284.7 179.4 L 282.1 371.9 L 208.4 354.9 Z" fill="url(#colFront)"/>
    <!-- Hairline Specular Arris -->
    <line x1="203.7" y1="167.7" x2="208.4" y2="354.9" stroke="#ffffff" stroke-width="0.6" opacity="0.2"/>

    <!-- 4. UNDER-DESK TRANSITION -->
    <path d="M 140.0 157.1 L 203.7 167.7 L 327.0 182.6 Z" fill="#140502"/>

    <!-- 5. SLANTED READING DESK SLAB (Wide 3D Surface) -->
    <!-- Left Cheek (Side thickness) -->
    <path d="M 188.9 99.9 L 130.0 159.1 L 130.5 166.7 L 189.1 107.1 Z" fill="url(#deskCheek)"/>
    <!-- Front Fascia (Front thickness) -->
    <path d="M 130.0 159.1 L 347.0 190.6 L 346.6 198.9 L 130.5 166.7 Z" fill="url(#deskFrontFascia)"/>
    <!-- Slanted Top Surface -->
    <path d="M 188.9 99.9 L 388.8 122.6 L 347.0 190.6 L 130.0 159.1 Z" fill="url(#desk3DTop)"/>

    <!-- Desk Chamfers (0.5px Hairline, Ultra-Subtle) -->
    <line x1="188.9" y1="99.9" x2="388.8" y2="122.6" stroke="#ffffff" stroke-width="0.8" opacity="0.25"/>
    <line x1="188.9" y1="99.9" x2="130.0" y2="159.1" stroke="#ffffff" stroke-width="0.6" opacity="0.2"/>
    <line x1="130.0" y1="159.1" x2="347.0" y2="190.6" stroke="#ffffff" stroke-width="0.5" opacity="0.18"/>

    <!-- 6. THE MANUSCRIPT (Pure White Sheet resting naturally on 3D Surface) -->
    <g filter="url(#paperShadow3D)">
      <path d="M 226.3 112.2 L 339.4 125.5 L 304.7 175.7 L 184.4 158.7 Z" fill="#ffffff"/>
      <path d="M 226.3 112.2 L 339.4 125.5" stroke="#ffffff" stroke-width="0.6" opacity="0.95"/>
      <path d="M 339.4 125.5 L 304.7 175.7" stroke="#ded8cd" stroke-width="0.5"/>
      <path d="M 304.7 175.7 L 184.4 158.7" stroke="#c9c1b3" stroke-width="0.5"/>
      <path d="M 184.4 158.7 L 226.3 112.2" stroke="#ffffff" stroke-width="0.5"/>

      <!-- H1 Terracotta Line (Subtle 2.5px) -->
      <line x1="231.1" y1="116.9" x2="287.9" y2="123.7" stroke="#ba583a" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>

      <!-- Subtitle Hairline -->
      <line x1="222.4" y1="126.7" x2="321.1" y2="139.0" stroke="#2b2624" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>

      <!-- Bullet Point 1 -->
      <circle cx="217.8" cy="137.1" r="1.4" fill="#ba583a" opacity="0.75"/>
      <line x1="230.3" y1="138.7" x2="313.7" y2="149.6" stroke="#2b2624" stroke-width="1.3" stroke-linecap="round" opacity="0.35"/>

      <!-- Bullet Point 2 -->
      <circle cx="209.2" cy="147.0" r="1.4" fill="#ba583a" opacity="0.75"/>
      <line x1="221.8" y1="148.7" x2="293.6" y2="158.4" stroke="#2b2624" stroke-width="1.3" stroke-linecap="round" opacity="0.28"/>

      <!-- Quote Line -->
      <line x1="197.3" y1="155.0" x2="295.6" y2="168.7" stroke="#2b2624" stroke-width="1.2" stroke-linecap="round" opacity="0.2"/>
    </g>

    <!-- 7. REFINED INTEGRAL RETAINING LEDGE (4px Beveled Strip, No Rivets!) -->
    <!-- Ledge Body -->
    <path d="M 130.4 155.1 L 347.4 186.6 L 347.0 190.6 L 130.0 159.1 Z" fill="url(#lip3D)"/>
    <!-- Top Specular Hairline (0.6px) -->
    <line x1="130.4" y1="155.1" x2="347.4" y2="186.6" stroke="#ffffff" stroke-width="0.6" opacity="0.65" stroke-linecap="round"/>
    <!-- Bottom Ambient Creep -->
    <line x1="130.0" y1="159.1" x2="347.0" y2="190.6" stroke="#360e05" stroke-width="0.6" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- macOS Superellipse Inner Specular Rim -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#rim3D)" stroke-width="1.8"/>
</svg>